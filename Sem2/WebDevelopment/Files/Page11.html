<!DOCTYPE html>
<html lang="en">
<head>
    <title>Semantic Tags Example</title>
</head>
<body>

    <header>
        <h1>My College Website</h1>
        <p>Welcome to the official page</p>
    </header>

    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Courses</a> |
        <a href="#">Contact</a>
    </nav>


 <main>
        <section>
            <h2>About Us</h2>
            <p>This section describes the institution.</p>
        </section>

        <article>
            <h2>Latest Announcement</h2>
            <p>Admissions are open for the new academic year.</p>
        </article>

        <aside>
            <h3>Notice Board</h3>
            <p>Exam schedule released.</p>
        </aside>
    </main>

    
<footer>
        <p>&copy; 2026 My College. All rights reserved.</p>
    </footer>

</body>
</html>
