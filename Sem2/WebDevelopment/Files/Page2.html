<html>
<head><title>TYPES OF HTML LISTS</title>
</head>
<body>
	<h1>HTML Lists Demonstrations</h1>
	<h2>Unordered List </h2>
	<ul>
		<li type="1">HTML</li>		
		<li type="A">CSS</li>		
		<li type="I">JavaScript</li>
	</ul>
	
	<h2>Ordered List </h2>
	<ol>
		<li>Required Analysis</li>
		<li>Design</li>
		<li>JavaScript</li>
	</ol>

	<h2>Description List </h2>
	<dt><b>HTML</b></dt>
	<dd>Used to code the structure of web pages</dd>
	<dt><b>CSS</b></dt>
	<dd>Used to style the web pages</dd>
	<dt><b>JavaScript</b></dt>
	<dd>Used to add interactivity to web pages</dd>


</body>
</html>
