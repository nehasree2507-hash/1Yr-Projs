<!DOCTYPE html>
<html>
<head>
    <title>Styled Form</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        form {
            background-color: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <form>
        <h3>Login Form</h3>

        <label>Email</label>
        <input type="email">

        <label>Password</label>
        <input type="password">

        <input type="submit" value="Login">
    </form>

</body>
</html>
