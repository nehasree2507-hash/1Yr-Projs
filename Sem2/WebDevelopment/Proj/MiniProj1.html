<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }
        main {
            width: 300px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 8px;
            background: #007BFF;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<main>
    <h2>Login</h2>
    <form>
        <label>Email</label>
        <input type="email" required>

        <label>Password</label>
        <input type="password" required>

        <button>Login</button>
    </form>
</main>

</body>
</html>
