<!DOCTYPE html>
<html>
<head>
    <title>Contact Page</title>
    <style>
        body {
            font-family: Arial;
        }
        header, footer {
            background: #333;
            color: white;
            padding: 10px;
            text-align: center;
        }
        section {
            width: 400px;
            margin: 30px auto;
        }
        input, textarea {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
        }
        button {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>Contact Us</h1>
</header>

<main>
    <section>
        <form>
            <label>Name</label>
            <input type="text">

            <label>Email</label>
            <input type="email">

            <label>Message</label>
            <textarea rows="4"></textarea>

            <button>Send</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Company</p>
</footer>

</body>
</html>
