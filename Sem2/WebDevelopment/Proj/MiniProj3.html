<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body {
            background: #eef2f3;
            font-family: Arial;
        }
        form {
            background: white;
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 8px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }
        button {
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

<form>
    <h2>Register</h2>

    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">

    <select>
        <option>Select Course</option>
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
    </select>

    <button>Create Account</button>
</form>

</body>
</html>
